[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedbench"
version = "0.1.0"
description = "Certified decision data and downstream-objective evaluation for minor embedders"
requires-python = ">=3.10"
dependencies = ["networkx>=3", "numpy>=1.24", "dimod>=0.12", "dwave-samplers>=1.2", "dwave-networkx>=0.8", "minorminer>=0.2.10", "scipy>=1.10"]

[project.optional-dependencies]
screen = ["scikit-learn>=1.3", "joblib"]
models = ["torch>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
embedbench = "embedbench.cli:main"
embedbench-isingfold-corpus = "embedbench.isingfold_corpus_cli:main"
embedbench-publish = "embedbench.publish_cli:main"
embedbench-structural-release = "embedbench.structural_release_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
embedbench = ["models/*.joblib"]
